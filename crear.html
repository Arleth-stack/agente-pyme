<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crea tu negocio</title>
    <link rel="icon" type="image/png" href="/marca/icono.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body class="pantalla-crear">
    <header class="marca-barra">
      <a href="/" aria-label="Merkatics, ir al inicio"><img src="/marca/merkatics-oscuro.png" alt="Merkatics" width="121" height="28" /></a>
    </header>
    <main class="crear">
      <a href="/" class="enlace-suave" id="volver-inicio"></a>
      <h1 id="titulo"></h1>
      <p id="subtitulo" class="suave"></p>

      <ol class="pasos" id="pasos"></ol>

      <form id="formulario" class="tarjeta-form" novalidate>
        <!-- Paso 1 · Tu negocio -->
        <fieldset data-paso="1">
          <legend id="p1-titulo"></legend>
          <p id="p1-ayuda" class="suave"></p>
          <label for="nombre" id="nombre-etiqueta"></label>
          <input id="nombre" maxlength="60" autocomplete="organization" />
          <label for="giro" id="giro-etiqueta"></label>
          <select id="giro"></select>
          <label for="telefono" id="telefono-etiqueta"></label>
          <input id="telefono" inputmode="numeric" maxlength="14" autocomplete="tel" />
          <label for="direccion" id="direccion-etiqueta"></label>
          <input id="direccion" maxlength="120" autocomplete="street-address" />
        </fieldset>

        <!-- Paso 2 · Horario -->
        <fieldset data-paso="2" hidden>
          <legend id="p2-titulo"></legend>
          <p id="p2-ayuda" class="suave"></p>
          <div id="horario"></div>
        </fieldset>

        <!-- Paso 3 · Preguntas -->
        <fieldset data-paso="3" hidden>
          <legend id="p3-titulo"></legend>
          <p id="p3-ayuda" class="suave"></p>
          <div id="lista-preguntas" class="crear-preguntas"></div>
          <button id="agregar-pregunta" type="button" class="boton-chico"></button>
        </fieldset>

        <!-- Paso 4 · Tu cuenta -->
        <fieldset data-paso="4" hidden>
          <legend id="p4-titulo"></legend>
          <p id="p4-ayuda" class="suave"></p>
          <label for="correo" id="correo-etiqueta"></label>
          <input id="correo" type="email" autocomplete="email" maxlength="120" />
          <label for="contrasena" id="contrasena-etiqueta"></label>
          <input id="contrasena" type="password" autocomplete="new-password" maxlength="72" />
          <label for="contrasena2" id="contrasena2-etiqueta"></label>
          <input id="contrasena2" type="password" autocomplete="new-password" maxlength="72" />
        </fieldset>

        <p id="error" class="mensaje-error" role="alert" hidden></p>
        <div class="crear-botones">
          <button id="atras" type="button" class="boton-secundario" hidden></button>
          <button id="siguiente" type="submit" class="boton-principal"></button>
        </div>
      </form>

      <section id="listo" class="tarjeta-form listo" hidden>
        <h2 id="listo-titulo"></h2>
        <p id="listo-texto" class="suave"></p>
        <div class="listo-enlace">
          <input id="listo-url" readonly />
          <button id="listo-copiar" type="button" class="boton-chico"></button>
        </div>
        <div class="crear-botones">
          <a id="listo-chat" class="boton-secundario boton-enlace" target="_blank" rel="noopener"></a>
          <a id="listo-panel" class="boton-principal boton-enlace" href="/panel"></a>
        </div>
      </section>
    </main>
    <script type="module" src="/src/crear.js"></script>
  </body>
</html>
