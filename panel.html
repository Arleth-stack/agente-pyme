<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi panel</title>
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body class="pantalla-panel">
    <header class="panel-encabezado">
      <div>
        <h1 id="nombre-negocio"></h1>
        <a id="ver-chat" class="enlace-suave" target="_blank" rel="noopener" hidden></a>
      </div>
      <button id="salir" class="boton-secundario" hidden></button>
    </header>

    <nav class="panel-pestanas" id="pestanas" hidden>
      <button data-seccion="conversaciones" class="pestana activa"></button>
      <button data-seccion="preguntas" class="pestana"></button>
    </nav>

    <main class="panel-contenido">
      <p id="mensaje" class="suave"></p>

      <section id="seccion-conversaciones" class="conversaciones" hidden>
        <div class="columna-lista">
          <div class="filtros" id="filtros" role="tablist"></div>
          <ul class="lista-conversaciones" id="lista-conversaciones"></ul>
          <p id="sin-conversaciones" class="suave" hidden></p>
        </div>

        <article class="detalle" id="detalle" hidden>
          <header class="detalle-encabezado">
            <button id="volver" class="boton-icono" type="button"></button>
            <div>
              <h2 id="detalle-nombre"></h2>
              <p id="detalle-datos" class="suave"></p>
            </div>
          </header>
          <p id="detalle-aviso" class="detalle-aviso" hidden></p>
          <div id="detalle-mensajes" class="detalle-mensajes"></div>
          <form id="detalle-form" class="detalle-form" autocomplete="off">
            <textarea id="detalle-texto" rows="2" maxlength="1000"></textarea>
            <p id="detalle-error" class="mensaje-error" role="alert" hidden></p>
            <div class="detalle-botones">
              <button id="detalle-resolver" type="button" class="boton-secundario"></button>
              <button id="detalle-enviar" type="submit" class="boton-principal"></button>
            </div>
          </form>
        </article>
      </section>

      <section id="seccion-preguntas" hidden>
        <div class="seccion-encabezado">
          <p id="preguntas-ayuda" class="suave"></p>
          <button id="preguntas-agregar" class="boton-principal" type="button"></button>
        </div>
        <form id="pregunta-form" class="tarjeta-form" novalidate hidden>
          <h2 id="pregunta-form-titulo"></h2>
          <label for="pf-tema" id="pf-tema-etiqueta"></label>
          <select id="pf-tema"></select>
          <label for="pf-pregunta" id="pf-pregunta-etiqueta"></label>
          <input id="pf-pregunta" maxlength="150" />
          <label for="pf-otras" id="pf-otras-etiqueta"></label>
          <input id="pf-otras" maxlength="300" />
          <label for="pf-respuesta" id="pf-respuesta-etiqueta"></label>
          <textarea id="pf-respuesta" rows="3" maxlength="500"></textarea>
          <p id="pf-error" class="mensaje-error" role="alert" hidden></p>
          <div class="detalle-botones">
            <button id="pf-cancelar" type="button" class="boton-secundario"></button>
            <button id="pf-guardar" type="submit" class="boton-principal"></button>
          </div>
        </form>
        <div id="lista-preguntas"></div>
      </section>
    </main>

    <script type="module" src="/src/panel.js"></script>
  </body>
</html>
