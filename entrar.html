<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar</title>
    <script>if (self !== top) document.documentElement.classList.add('incrustado')</script>
    <link rel="icon" type="image/png" href="/marca/icono.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body class="pantalla-entrar">
    <header class="marca-barra">
      <a href="/" aria-label="Merkatics, ir al inicio"><img src="/marca/merkatics-claro.png" alt="Merkatics" width="121" height="28" /></a>
    </header>
    <main class="tarjeta-entrar">
      <h1 id="titulo"></h1>
      <p id="texto" class="suave"></p>
      <form id="formulario" novalidate>
        <label for="correo" id="etiqueta-correo"></label>
        <input id="correo" type="email" autocomplete="email" maxlength="120" />
        <label for="contrasena" id="etiqueta-contrasena"></label>
        <input id="contrasena" type="password" autocomplete="current-password" maxlength="72" />
        <p id="error" class="mensaje-error" role="alert" hidden></p>
        <button id="boton" type="submit" class="boton-principal"></button>
      </form>
      <p class="entrar-crear"><a href="/crear" id="enlace-crear" class="enlace-suave"></a></p>
    </main>
    <script type="module" src="/src/entrar.js"></script>
  </body>
</html>
